name: CI - Anchor tests

on:
  push:
    branches: [main, master, ci/add-github-actions]
  pull_request:
    branches: [main, master]
  workflow_dispatch: {}

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: actions-rs/toolchain@v1
        with:
          toolchain: stable

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config libssl-dev llvm clang make

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "18"
          cache: "npm"

      - name: Install Solana CLI
        run: |
          curl -sSfL https://release.solana.com/v1.17.20/install | sh
          echo "$HOME/.local/share/solana/install/active_release/bin" >> $GITHUB_PATH
          solana --version

      - name: Install Anchor CLI
        run: |
          cargo install --locked --git https://github.com/coral-xyz/anchor anchor-cli || true
          anchor --version || true

      - name: Install Node dependencies
        working-directory: ./programs/coco_staking
        run: |
          npm ci

      - name: Build Anchor program
        working-directory: ./programs/coco_staking
        run: |
          anchor build

      - name: Run Anchor tests
        working-directory: ./programs/coco_staking
        env:
          RUST_BACKTRACE: 1
        run: |
          anchor test
